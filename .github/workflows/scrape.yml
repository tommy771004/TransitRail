name: Daily Transit Data Scrape

on:
  schedule:
    # Run at 22:00 UTC every day = 06:00 Taiwan time (UTC+8)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Start date (YYYY-MM-DD, default: today in Asia/Taipei); scrapes 7 days forward"
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A backstop against a hung provider, not a budget the job is expected to
    # spend. 30 was below what a healthy run legitimately needed once London
    # started sweeping its operating day, so the daily scrape was cancelled with
    # three of seven dates collected and — because a cancelled job skips the
    # commit step — nothing kept. The TfL browser sweep takes roughly 20 minutes
    # for its 28 route-days; 45 leaves room for a slow provider or a retried page
    # navigation while still catching a genuine hang.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run scrapers
        env:
          # Enables the Switzerland OJP scrape. The token must additionally be
          # subscribed to OJP 2.0 in the opentransportdata.swiss portal — a key
          # that exists but is not gets HTTP 403 "Access to this API has been
          # disallowed" on every route. Without the secret the scraper is skipped.
          SWISS_OJP_URL: https://api.opentransportdata.swiss/ojp20
          SWISS_OJP_TOKEN: ${{ secrets.SWISS_OJP_TOKEN }}
          SWISS_OJP_REQUESTOR_REF: TransitRail_prod
          # Optional. Toei uses the public ODPT endpoint without this secret;
          # Tokyo Metro routes refresh when the repository secret is present.
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          # Required for the official LTA DataMall Singapore GTFS train feed.
          # The scraper preserves the last verified artifact when it is absent
          # or the API cannot be reached.
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: npm run scrape -- ${{ github.event.inputs.date }}

      # The gate between the run and its publication. Every check that fails
      # here is a statement the app would otherwise make and could not support:
      # a departure nobody published, a train arriving before it left, rows no
      # official source vouches for, or a country that just lost most of its
      # data to a silently broken parser.
      #
      # `--against-head` compares the run against the last commit, so a feed
      # that starts answering 200 with an empty envelope is caught as data loss
      # rather than accepted as a schedule with no trains in it.
      - name: Validate scraped data
        run: npm run validate:data -- --against-head

      # Only runs when validation failed. Restores the previously committed
      # data so the runner's tree matches what is published, then the job stops
      # before the commit step: a bad run leaves yesterday's real timetable in
      # place rather than replacing it with something wrong.
      - name: Discard the failed run
        if: failure()
        run: |
          git checkout -- src/data/scraped src/data/service-day || true
          git clean -fd src/data/scraped src/data/service-day || true
          echo "::error::Validation failed. The previously committed data has been kept and nothing was published."

      - name: Generate static station catalog
        env:
          # The UK menu is still built from the TfL API. The timetable scraper
          # above uses the official web Journey Planner and does not need this key.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: npm run catalog

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update transit scraped data [skip ci]"
          file_pattern: "src/data/scraped/*.json src/data/scraped/*/*.json src/data/scraped/*/*.json.gz src/data/service-day/*.json src/data/catalog/*.json public/catalog/*.json"
          commit_user_name: "TransitRail Scraper Bot"
          commit_user_email: "scraper@transitrail.app"

      - name: Notify saved-route subscribers of timetable changes
        env:
          # All optional — the script no-ops without them, so deployments that
          # don't use push notifications can leave these secrets unset.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: npm run push:check
