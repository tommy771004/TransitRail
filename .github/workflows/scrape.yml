name: Daily Transit Data Scrape

on:
  schedule:
    # Runs every night at 22:00 UTC = 06:00 Taiwan time (UTC+8), but not every
    # night collects the same thing. Markets whose source only answers for today
    # (Hong Kong's next-train feed, Thailand's service hours) have to refresh
    # daily or that day has no data at all. Every other market is collected on
    # the slower full-scrape cadence, and `scripts/scrape-plan.ts` decides which
    # kind of pass tonight is — see its header for why that is read off the data
    # rather than the calendar.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Start date (YYYY-MM-DD, default: today in Asia/Taipei)"
        required: false
        type: string
      mode:
        description: "Which pass to run"
        required: false
        default: auto
        type: choice
        options: [auto, full, live-only]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A backstop against a hung provider, not a budget the job is expected to
    # spend. 30 was below what a healthy run legitimately needed once London
    # started sweeping its operating day, so the daily scrape was cancelled with
    # three of seven dates collected and — because a cancelled job skips the
    # commit step — nothing kept. Provider sweeps can slow down materially when
    # rate-limited or when browser navigation retries are needed, so leave a
    # full 90-minute recovery window while still terminating a genuinely hung
    # run well below GitHub Actions' six-hour job limit.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # `full` collects the search window plus the headroom that lets it stay
      # correct until the next full run; `live-only` refreshes just the markets
      # that would otherwise have nothing for today.
      - name: Decide tonight's pass
        id: plan
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            MODE="$(npx tsx scripts/scrape-plan.ts)"
          fi
          echo "Pass: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run scrapers
        env:
          # Enables the Switzerland OJP scrape. The token must additionally be
          # subscribed to OJP 2.0 in the opentransportdata.swiss portal — a key
          # that exists but is not gets HTTP 403 "Access to this API has been
          # disallowed" on every route. Without the secret the scraper is skipped.
          SWISS_OJP_URL: https://api.opentransportdata.swiss/ojp20
          SWISS_OJP_TOKEN: ${{ secrets.SWISS_OJP_TOKEN }}
          SWISS_OJP_REQUESTOR_REF: TransitRail_prod
          # Optional. Toei uses the public ODPT endpoint without this secret;
          # Tokyo Metro routes refresh when the repository secret is present.
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          # Raises London's rate limit. The sweep verifies the key before
          # pacing to the subscription rate and falls back to anonymous when
          # it is unusable, so a stale value degrades rather than fails — but
          # without it the sweep paces slowly and samples start aborting.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          # Required for the official LTA DataMall Singapore GTFS train feed.
          # Only the authenticated resolver mints a usable archive link: the
          # key-free static ZIP is a frozen copy of one response whose signed
          # link expired 15 minutes after it was published. Without a valid
          # secret the scraper keeps the last verified artifact.
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: |
          if [ "${{ steps.plan.outputs.mode }}" = "live-only" ]; then
            npm run scrape -- --live-only ${{ github.event.inputs.date }}
          else
            npm run scrape -- ${{ github.event.inputs.date }}
          fi

      # A scrape only prunes the dates it collected, so between full passes the
      # snapshot markets keep yesterday's slice. Those rows can never answer a
      # search — the picker offers today forward — so drop them before the run
      # is judged and published.
      - name: Drop timetable rows for past service days
        run: npm run prune:past

      # The gate between the run and its publication. Every check that fails
      # here is a statement the app would otherwise make and could not support:
      # a departure nobody published, a train arriving before it left, rows no
      # official source vouches for, or a country that just lost most of its
      # data to a silently broken parser.
      #
      # `--against-head` compares the run against the last commit, so a feed
      # that starts answering 200 with an empty envelope is caught as data loss
      # rather than accepted as a schedule with no trains in it.
      # Keep the exact findings after a failed run. GitHub's job annotation only
      # says that this command exited non-zero; the report distinguishes a real
      # source/provenance violation from a provider's transient row loss.
      - name: Validate scraped data
        id: validate_data
        continue-on-error: true
        run: |
          set -o pipefail
          npm run validate:data -- --against-head 2>&1 | tee validation-report.txt

      - name: Publish validation report
        if: always()
        run: |
          if [ -f validation-report.txt ]; then
            {
              echo "## Timetable validation report"
              echo '```text'
              cat validation-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-validation-report
          path: validation-report.txt
          if-no-files-found: warn
          retention-days: 14

      # Only runs when validation failed. Restores the previously committed
      # data so the runner's tree matches what is published, then the job stops
      # before the commit step: a bad run leaves yesterday's real timetable in
      # place rather than replacing it with something wrong.
      - name: Discard the failed run
        if: steps.validate_data.outcome == 'failure'
        run: |
          git checkout -- src/data/scraped src/data/service-day || true
          git clean -fd src/data/scraped src/data/service-day || true
          echo "::error::Validation failed. The previously committed data has been kept and nothing was published."

      - name: Mark validation failure
        if: steps.validate_data.outcome == 'failure'
        run: exit 1

      - name: Generate static station catalog
        env:
          # The UK menu is built from the same TfL API the timetable scrape uses.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: npm run catalog

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update transit scraped data [skip ci]"
          file_pattern: "src/data/scraped/*.json src/data/scraped/*/*.json src/data/scraped/*/*.json.gz src/data/service-day/*.json src/data/catalog/*.json public/catalog/*.json"
          commit_user_name: "TransitRail Scraper Bot"
          commit_user_email: "scraper@transitrail.app"

      - name: Notify saved-route subscribers of timetable changes
        env:
          # All optional — the script no-ops without them, so deployments that
          # don't use push notifications can leave these secrets unset.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: npm run push:check
