name: CI

# `npm run lint` is the repository's required gate, but until now nothing ran it
# outside a developer's machine: the only workflow was the nightly scrape, which
# validates data and never runs the suite. Four test files had been failing for
# long enough that the failures read as normal.
on:
  # Exercise calendar-sensitive behavior even during weeks without a code push.
  # This is deliberately separate from the nightly data-publication gate.
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second run from the same trigger and ref makes the earlier answer irrelevant.
# Keep the weekly health check independent from a simultaneous main push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Typecheck plus the full Vitest suite. No provider secrets are set: every
      # scraper must degrade safely without its key, so a suite that needs one to
      # pass is itself the finding.
      - name: Typecheck and test
        run: npm run lint

      - name: Install browser for UI smoke check
        run: npx playwright install --with-deps chromium

      - name: Verify Material 3 UI flows
        run: npm run check:ui
